services:
  evolution_api:
    container_name: prod_evolution_api
    image: evoapicloud/evolution-api:v2.3.4
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${DOCKER_HOST_IP}:${DOCKER_HOST_PORT}:8080"
    env_file:
      - .env
    networks:
      - evolution_net
    command: ["node", "./dist/src/main.js"]

  postgres:
    image: postgres:15-alpine
    container_name: prod_evo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_net

  redis:
    image: redis:7.4-alpine
    container_name: prod_evo_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - evolution_net

volumes:
  postgres_data:

networks:
  evolution_net:
